version: '3.8'

services:
  # Application Streamlit (Frontend + Backend + IA)
  transcriber-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcriber-app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - transcriptions:/app/output
    secrets:
      - assemblyai_key
    networks:
      - transcriber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de données PostgreSQL pour stocker l'historique des transcriptions
  postgres:
    image: postgres:15-alpine
    container_name: transcriber-db
    environment:
      POSTGRES_DB: transcriber
      POSTGRES_USER: transcriber_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - transcriber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcriber_user -d transcriber"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx comme reverse proxy
  nginx:
    image: nginx:alpine
    container_name: transcriber-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - transcriber-app
    networks:
      - transcriber-network
    restart: unless-stopped

volumes:
  transcriptions:
  postgres_data:

networks:
  transcriber-network:
    driver: bridge

secrets:
  assemblyai_key:
    file: ./.secrets/assemblyai_key.txt
  db_password:
    file: ./.secrets/db_password.txt

